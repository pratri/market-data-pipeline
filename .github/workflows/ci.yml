name: CI

# Everything except `build` runs on every push and PR and needs no
# credentials. `dbt parse` only resolves refs and Jinja, so the models also
# get parsed as Snowflake by sqlfluff and actually run on DuckDB against a
# fixture. The build job runs dbt against Snowflake and is manual only,
# since it uses trial credits.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:        # the "Run workflow" button

jobs:

  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install ruff
        run: pip install ruff

      # syntax errors and undefined names only
      - name: Check for syntax errors and undefined names
        run: ruff check scripts/ dags/ --select E9,F63,F7,F82

      - name: Report style issues without failing
        run: ruff check scripts/ dags/ --exit-zero

  validate-dags:
    name: Validate Airflow DAGs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # importing each DAG catches bad imports and schedule errors
      - name: Install Airflow
        run: pip install "apache-airflow==3.0.2" pendulum

      - name: Check DAGs import cleanly
        env:
          AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
          AIRFLOW_HOME: ${{ github.workspace }}/.airflow
        run: |
          python -c "
          import sys, pathlib, importlib.util
          failed = []
          for path in pathlib.Path('dags').glob('*.py'):
              spec = importlib.util.spec_from_file_location(path.stem, path)
              module = importlib.util.module_from_spec(spec)
              try:
                  spec.loader.exec_module(module)
                  print(f'OK   {path.name}')
              except Exception as exc:
                  print(f'FAIL {path.name}: {type(exc).__name__}: {exc}')
                  failed.append(path.name)
          sys.exit(1 if failed else 0)
          "

  validate-dbt:
    name: Validate dbt models
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dbt
        run: pip install dbt-core dbt-snowflake

      # dbt parse resolves refs and sources without connecting to the
      # warehouse. It still wants a profile, so write a dummy one.
      - name: Write dummy profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<'EOF'
          market_data:
            target: ci
            outputs:
              ci:
                type: snowflake
                account: not-used-for-parsing
                user: ci
                password: ci
                role: ci
                database: MARKET_DATA
                warehouse: ci
                schema: ANALYTICS
                threads: 1
          EOF

      - name: Install dbt packages
        working-directory: dbt
        run: dbt deps

      - name: Parse models and resolve dependencies
        working-directory: dbt
        run: dbt parse


  parse-sql-as-snowflake:
    name: Parse SQL as Snowflake
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install sqlfluff
        run: pip install sqlfluff

      # Fails on SQL Snowflake can't parse: typos, unbalanced brackets, a
      # clause in the wrong dialect. It won't catch a function that exists
      # elsewhere but not in Snowflake, so it's a floor, not a guarantee.
      # Config (including the ref/source stubs) is in .sqlfluff.
      - name: Parse models
        run: sqlfluff parse dbt/models

      - name: Parse singular tests
        run: sqlfluff parse dbt/tests

  test-models:
    name: Run models on DuckDB
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install
        run: pip install duckdb pandas pyarrow pyyaml

      # Extraction rules that the fixtures can't cover, because the fixtures
      # are what extraction already produced.
      - name: Ingestion unit tests
        run: python tests/test_ingestion.py

      # Builds every model over 21 tickers of real SEC and Yahoo data, runs
      # the tests declared in the .yml files and dbt/tests/, then checks
      # values with a known right answer (headline revenue, market cap
      # across a split, the quarter each trading day should be using).
      - name: Build models and check the output
        run: python tests/run_models_duckdb.py

  build:
    name: Build and test against Snowflake
    runs-on: ubuntu-latest

    # manual only, costs credits
    if: github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dbt
        run: pip install dbt-core dbt-snowflake

      # credentials come from repo secrets
      - name: Write profile from secrets
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<EOF
          market_data:
            target: ci
            outputs:
              ci:
                type: snowflake
                account: "${SNOWFLAKE_ACCOUNT}"
                user: "${SNOWFLAKE_USER}"
                password: "${SNOWFLAKE_PASSWORD}"
                role: ACCOUNTADMIN
                database: MARKET_DATA
                warehouse: MARKET_WH
                schema: ANALYTICS_CI
                threads: 4
          EOF

      - name: Install dbt packages
        working-directory: dbt
        run: dbt deps

      # build runs tests between models, so a failing test stops downstream models
      - name: Build models and run tests
        working-directory: dbt
        run: dbt build

      # keep logs even when the run fails
      - name: Upload dbt artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-artifacts
          path: |
            dbt/target/
            dbt/logs/
          retention-days: 7
