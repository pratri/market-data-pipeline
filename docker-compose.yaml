# Airflow 3 with LocalExecutor. It all runs on one EC2 box, so no Celery.
#
#   postgres       metadata db
#   airflow-init   runs db migrations once
#   scheduler      schedules and runs tasks
#   apiserver      UI + the execution API tasks call back into
#   dag-processor  parses DAG files

x-airflow-common: &airflow-common
  build: .
  image: market-pipeline-airflow:latest
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor

    # tasks call the API server over HTTP. Without this they try localhost
    # and fail with connection refused.
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://apiserver:8080/execution/

    # has to be the same in every container, otherwise tasks sit in queued
    # with "Signature verification failed"
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}

    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"

    # encrypts connections and variables in the db
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}

    # for the ingestion scripts. On EC2 the instance profile provides AWS creds.
    S3_BUCKET: ${S3_BUCKET}
    AWS_REGION: ${AWS_REGION:-us-east-1}
    SEC_USER_AGENT: ${SEC_USER_AGENT}

    # scripts import s3_utils as a sibling module
    PYTHONPATH: /opt/airflow/project/scripts

  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./scripts:/opt/airflow/project/scripts
    - ./data:/opt/airflow/project/data
    # local dev only, remove on EC2
    - ${USERPROFILE}/.aws:/home/airflow/.aws:ro

  # run as the host user so mounted files aren't owned by root
  # (on Linux set AIRFLOW_UID to `id -u`)
  user: "${AIRFLOW_UID:-50000}:0"

  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  # One-shot migration, everything else waits for it.
  # No user creation: Airflow 3's SimpleAuthManager generates a password on
  # first start (simple_auth_manager_passwords.json.generated).
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - airflow db migrate
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
    user: "0:0"
    restart: on-failure

  scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  dag-processor:
    <<: *airflow-common
    command: dag-processor
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-db-volume:
