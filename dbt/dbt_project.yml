name: 'market_data'
version: '1.0.0'
config-version: 2

profile: 'market_data'

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  market_data:
    # views, these are just renames over raw
    staging:
      +materialized: view
      +schema: staging

    # tables, since the marts read them repeatedly
    intermediate:
      +materialized: table
      +schema: intermediate

    marts:
      +materialized: table
      +schema: marts
