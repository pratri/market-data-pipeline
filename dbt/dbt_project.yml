name: 'market_data'
version: '1.0.0'
config-version: 2

profile: 'market_data'

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  market_data:
    # Staging models are views: they're thin renames and casts over raw,
    # so materializing them as tables would duplicate storage for no
    # query-time benefit.
    staging:
      +materialized: view
      +schema: staging

    # Intermediate models do the heavy filtering and pivoting. Tables,
    # because the marts read them repeatedly and recomputing a view
    # every time is wasteful.
    intermediate:
      +materialized: table
      +schema: intermediate

    marts:
      +materialized: table
      +schema: marts
