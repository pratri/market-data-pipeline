version: 2

sources:
  - name: raw
    database: MARKET_DATA
    schema: RAW
    description: Loaded from S3 with COPY INTO. Not modified after loading.

    tables:
      - name: prices
        description: >
          Daily OHLCV plus dividends and split ratios. A rewritten partition
          is loaded again, so a ticker-day can appear more than once.
        columns:
          - name: trade_date
            description: >
              Parsed from the S3 path (date=YYYY-MM-DD). The parquet files
              don't contain it.
            tests:
              - not_null
          - name: ticker
            tests:
              - not_null
          - name: close
            tests:
              - not_null
          - name: fetched_at
            description: >
              UTC time the row was downloaded from Yahoo, or the file's S3
              upload time for files written before the column existed. Yahoo
              split-adjusts as of this moment.

      - name: fundamentals
        description: >
          SEC XBRL facts, one row per company, metric and period, from the
          first 10-K/10-Q that reported it. Holds every snapshot, so
          downstream models filter to the latest.
        columns:
          - name: ticker
            tests:
              - not_null
          - name: metric
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values:
                      - revenue
                      - net_income
                      - operating_income
                      - total_assets
                      - total_liabilities
                      - stockholders_equity
                      - shares_outstanding
                      - cash_and_equivalents
                      - operating_cash_flow
                      - cover_shares_outstanding
          - name: period_end
            tests:
              - not_null
