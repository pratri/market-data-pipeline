version: 2

sources:
  - name: raw
    database: MARKET_DATA
    schema: RAW
    description: Loaded from S3 with COPY INTO. Not modified after loading.

    tables:
      - name: prices
        description: Daily OHLCV, one row per ticker per trading day.
        columns:
          - name: trade_date
            description: >
              Parsed from the S3 path (date=YYYY-MM-DD). The parquet files
              don't contain it.
            tests:
              - not_null
          - name: ticker
            tests:
              - not_null
          - name: close
            tests:
              - not_null

      - name: fundamentals
        description: >
          SEC XBRL facts, one row per company, metric and period. Holds every
          snapshot, so downstream models filter to the latest.
        columns:
          - name: ticker
            tests:
              - not_null
          - name: metric
            tests:
              - not_null
              - accepted_values:
                  values:
                    - revenue
                    - net_income
                    - operating_income
                    - total_assets
                    - total_liabilities
                    - stockholders_equity
                    - shares_outstanding
                    - cash_and_equivalents
                    - operating_cash_flow
          - name: period_end
            tests:
              - not_null
