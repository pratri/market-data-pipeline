version: 2

models:
  - name: stg_prices
    description: Cleaned daily OHLCV, one row per ticker per trading day.
    columns:
      - name: trade_date
        tests:
          - not_null
      - name: ticker
        tests:
          - not_null
      - name: close_price
        tests:
          - not_null
          # a close of 0 or less is bad data
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
    tests:
      # one row per ticker per day
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - trade_date
              - ticker

  - name: stg_fundamentals
    description: Latest SEC snapshot, with each fact labelled by period length.
    columns:
      - name: ticker
        tests:
          - not_null
      - name: metric
        tests:
          - not_null
      - name: period_end
        tests:
          - not_null
      - name: period_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['instant', 'quarterly', 'half_year', 'nine_month', 'annual', 'other']
    tests:
      # duplicates here mean more than one snapshot got through
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - ticker
              - metric
              - period_start
              - period_end
