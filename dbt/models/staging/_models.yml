version: 2

models:
  - name: stg_prices
    description: Cleaned daily OHLCV, one row per ticker per trading day.
    columns:
      - name: trade_date
        tests:
          - not_null
      - name: ticker
        tests:
          - not_null
      - name: close_price
        tests:
          - not_null
          # Prices are strictly positive. A zero or negative close means
          # bad source data, not a real market event.
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: false
    tests:
      # The real grain assertion: one row per ticker per day. If this
      # fails, something upstream is duplicating rows and every
      # downstream aggregate is wrong.
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - trade_date
            - ticker

  - name: stg_fundamentals
    description: >
      Latest SEC snapshot only, with reporting period classified by
      duration so flow metrics can be filtered to true quarters.
    columns:
      - name: ticker
        tests:
          - not_null
      - name: metric
        tests:
          - not_null
      - name: period_end
        tests:
          - not_null
      - name: period_type
        tests:
          - not_null
          - accepted_values:
              values: ['instant', 'quarterly', 'half_year', 'nine_month', 'annual', 'other']
    tests:
      # After snapshot filtering, a company should report each metric
      # once per distinct period. A duplicate here means the snapshot
      # filter failed and multiple snapshots leaked through.
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - ticker
            - metric
            - period_start
            - period_end
