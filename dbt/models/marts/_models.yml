version: 2

models:
  - name: fct_daily_metrics
    description: >
      Daily fact table joining prices to the most recent fundamentals
      publicly available as of that trading day. Fundamentals attach by
      FILING date rather than period end, so no row contains information
      that wasn't public on its trade_date.
    columns:
      - name: trade_date
        tests: [not_null]
      - name: ticker
        tests:
          - not_null
          - relationships:
              to: ref('dim_companies')
              field: ticker
      - name: sector
        tests: [not_null]
      - name: close_price
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: false
      - name: days_since_filing
        description: >
          Trading day minus filing date. Never negative; a negative
          value would mean fundamentals were attached before they were
          public, which is lookahead bias.
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true
      - name: pe_ratio
        description: >
          Market cap over TTM net income. Null where earnings are
          negative or fewer than four quarters are available: a negative
          P/E is meaningless and poisons cross-sectional averages.
      - name: price_to_sales
        description: >
          Null for Financials by design. Banks do not report a revenue
          figure comparable to an operating company's, so P/S would look
          valid and mean nothing. Price-to-book is the appropriate ratio
          for those companies and is populated.
      - name: market_cap
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: false
              config:
                where: "market_cap is not null"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [trade_date, ticker]

  - name: dim_companies
    description: >
      One row per company with sector, identifiers, latest reported
      figures, and flags describing data-quality limitations.
    columns:
      - name: ticker
        tests:
          - not_null
          - unique
      - name: cik
        tests: [not_null]
      - name: sector
        tests:
          - not_null
          - accepted_values:
              values:
                - Technology
                - Financials
                - Health Care
                - Industrials
                - Consumer Staples
                - Consumer Discretionary
                - Communication Services
                - Energy
                - Unclassified
      - name: revenue_metric_applicable
        description: >
          False for Financials. Banks report interest and non-interest
          income rather than revenue, so revenue-based ratios are
          suppressed rather than computed from an incomparable figure.
      - name: insufficient_revenue_history
        description: >
          True where fewer than four quarters of revenue exist,
          regardless of sector. Catches gaps the hardcoded sector
          mapping wouldn't.
      - name: has_stale_fundamentals
        description: >
          True where the most recent filing is over six months old.
          Expected for at least one ticker whose current CIK is a
          recently registered entity following a reorganization.
