version: 2

models:
  - name: fct_daily_metrics
    description: >
      Daily prices joined to the latest fundamentals filed on or before each
      trade date. Joins on filing date, not period end.
    columns:
      - name: trade_date
        tests: [not_null]
      - name: ticker
        tests:
          - not_null
          - relationships:
              to: ref('dim_companies')
              field: ticker
      - name: sector
        tests: [not_null]
      - name: close_price
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: false
      - name: days_since_filing
        description: Trade date minus filing date. Negative would mean lookahead.
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true
      - name: pe_ratio
        description: >
          Market cap over TTM net income. Null for negative earnings or fewer
          than 4 quarters.
      - name: price_to_sales
        description: >
          Null for Financials on purpose, since bank revenue isn't comparable.
          Use price_to_book for those.
      - name: market_cap
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: false
              config:
                where: "market_cap is not null"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [trade_date, ticker]

  - name: dim_companies
    description: One row per company with sector, latest figures and data quality flags.
    columns:
      - name: ticker
        tests:
          - not_null
          - unique
      - name: cik
        tests: [not_null]
      - name: sector
        tests:
          - not_null
          - accepted_values:
              values:
                - Technology
                - Financials
                - Health Care
                - Industrials
                - Consumer Staples
                - Consumer Discretionary
                - Communication Services
                - Energy
                - Unclassified
      - name: revenue_metric_applicable
        description: False for Financials, where revenue ratios are suppressed.
      - name: insufficient_revenue_history
        description: True when a company has fewer than 4 quarters of revenue.
      - name: has_stale_fundamentals
        description: True when the latest quarter ended more than 6 months ago.
